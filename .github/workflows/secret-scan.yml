name: secret-scan

# Fleet secret-scan gate: runs the gitleaks BINARY, not gitleaks-action.
#
# The action requires a paid license for ORGANIZATION-owned repos, and smilinTux
# is an org, so it exits with "missing gitleaks license" BEFORE scanning a single
# byte. skcomms carried exactly that gate for months: permanently red, therefore
# ignored, and scanning nothing at all. gitleaks itself is MIT and free; only the
# wrapper is licensed, so calling the binary restores real scanning at no cost
# with no org secret to provision.
#
# Pinned to an exact version so a new upstream rule cannot redden CI without a
# deliberate bump. --redact keeps a genuine finding out of public CI logs.
# --exit-code 1 fails the build on a finding.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the scan walks commits, not just the tree
      # A shallow or grafted clone makes gitleaks read the boundary commit as one
      # enormous addition of the whole tree, which finds matches a full-history
      # scan of the same ref does not. On 2026-08-27 CI reported 133 commits and
      # one leak on a ref that scans 138 commits and zero leaks locally, with the
      # same pinned binary. Proving the checkout depth is the first thing anyone
      # debugging that divergence needs, so record it before scanning.
      - name: Record what is actually checked out
        run: |
          set -euo pipefail
          echo "ref:       ${GITHUB_REF}"
          echo "sha:       ${GITHUB_SHA}"
          echo "head sha:  $(git rev-parse HEAD)"
          echo "commits:   $(git rev-list --count HEAD)"
          echo "shallow:   $(git rev-parse --is-shallow-repository)"
          echo "grafted:   $([ -f .git/shallow ] && echo yes || echo no)"
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # This repo's history scanned CLEAN on 2026-08-14, so the gate covers the
      # FULL history. If it ever goes red, a secret was ADDED: rotate it and
      # purge it, do not weaken this to an incremental scan.
      #
      # The scan writes a REDACTED json report and, on a finding, prints the
      # rule, file, line, commit and author. It never prints the matched value.
      # Before this, the job failed with nothing but "leaks found: 1", which is
      # not enough to rotate anything: you cannot purge a secret you cannot
      # locate, and the only available response was to weaken the gate. That is
      # exactly backwards.
      - name: Scan (full history)
        id: scan
        run: |
          set -euo pipefail
          CFG=""
          # NOTE: written as an if, not `[ -f x ] && CFG=...`. Under `set -e` that
          # one-liner exits the step with status 1 when the file is ABSENT,
          # because the whole && list returns non-zero. The gate would then fail
          # having scanned nothing, and look identical to a real finding.
          if [ -f .gitleaks.toml ]; then
            CFG="--config .gitleaks.toml"
            echo "using repo gitleaks config"
          else
            echo "no repo gitleaks config; using built-in rules"
          fi
          set +e
          gitleaks detect --source . $CFG --redact --no-banner \
            --report-format json --report-path gitleaks-report.json --exit-code 1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::group::findings (redacted)"
            python3 .github/scripts/print_gitleaks_findings.py gitleaks-report.json
            echo "::endgroup::"
          fi
          exit "$rc"
      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
